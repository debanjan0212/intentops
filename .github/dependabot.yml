version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # Raise a minimum version only when the current range does not already allow the new release.
    # Without this, every new release of a dependency opens a pull request that changes nothing in CI
    # and forces users to upgrade.
    versioning-strategy: increase-if-necessary
    # Propose a release only after it has been public for a week. Security updates are not delayed.
    cooldown:
      default-days: 7
  # keeps the SHA pins in .github/workflows and action.yml current, as one pull request instead of one per action
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
