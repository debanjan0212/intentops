{{- if .Values.secrets }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.name }}-secrets
  {{- include "svc.meta" . | nindent 2 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.platform.secretStore }}
  target:
    name: {{ .Values.name }}-secrets
  data:
    {{- range .Values.secrets }}
    - secretKey: {{ .envKey }}
      remoteRef:
        {{- /* each platform names secrets differently, e.g. team/name/secret or team-name-secret */}}
        key: {{ $.Values.platform.secretKeyFormat | replace "{team}" $.Values.team | replace "{name}" $.Values.name | replace "{secret}" .name | quote }}
    {{- end }}
{{- end }}
