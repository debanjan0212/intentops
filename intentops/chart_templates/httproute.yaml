{{- if ne .Values.exposure "private" }}
{{- $gw := index .Values.platform.gateways .Values.exposure }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.name }}
  {{- include "svc.meta" . | nindent 2 }}
spec:
  parentRefs:
    - name: {{ $gw.name }}
      namespace: {{ $gw.namespace }}
  {{- with .Values.hostname }}
  hostnames:
    - {{ . | quote }}
  {{- end }}
  rules:
    - backendRefs:
        - name: {{ .Values.name }}
          port: 80
{{- end }}
