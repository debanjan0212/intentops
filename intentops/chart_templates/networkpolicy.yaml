apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.name }}
  {{- include "svc.meta" . | nindent 2 }}
spec:
  podSelector:
    matchLabels:
      {{- include "svc.selector" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if .Values.egressLocked }}
    - Egress
    {{- end }}
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.platform.monitoringNamespace }}
        {{- if ne .Values.exposure "private" }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ (index .Values.platform.gateways .Values.exposure).namespace }}
        {{- end }}
      ports:
        - port: {{ .Values.port }}
  {{- /* sensitive data: deny egress except DNS and the declared dependencies */}}
  {{- if .Values.egressLocked }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- range .Values.dependencies }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .name }}
          {{- if .namespace }}
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .namespace }}
          {{- end }}
    {{- end }}
  {{- end }}
