{{- $canary := eq .Values.release "canary" }}
apiVersion: {{ if $canary }}argoproj.io/v1alpha1{{ else }}apps/v1{{ end }}
kind: {{ if $canary }}Rollout{{ else }}Deployment{{ end }}
metadata:
  name: {{ .Values.name }}
  {{- include "svc.meta" . | nindent 2 }}
spec:
  # replicas are owned by the HorizontalPodAutoscaler
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "svc.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "svc.labels" . | nindent 8 }}
        {{- with .Values.platform.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ .Values.name }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: {{ .Values.platform.topologyWhenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "svc.selector" . | nindent 14 }}
      containers:
        - name: {{ .Values.name }}
          image: {{ .Values.image | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          readinessProbe:
            httpGet:
              path: {{ .Values.healthPath }}
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: {{ .Values.healthPath }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          # memory limit = request (no overcommit); no CPU limit, to avoid CFS throttling under bursts
          resources:
            requests:
              cpu: {{ .Values.resources.cpu | quote }}
              memory: {{ .Values.resources.memory | quote }}
            limits:
              memory: {{ .Values.resources.memory | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          {{- if .Values.secrets }}
          envFrom:
            - secretRef:
                name: {{ .Values.name }}-secrets
          {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.platform.spotNode }}
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: {{ .key }}
                    operator: In
                    values: [{{ .value | quote }}]
      {{- if .taint }}
      tolerations:
        - key: {{ .key }}
          operator: Equal
          value: {{ .value | quote }}
          effect: NoSchedule
      {{- end }}
      {{- end }}
  strategy:
  {{- if $canary }}
    canary:
      analysis:
        templates:
          - templateName: {{ .Values.name }}-slo
        startingStep: 1
        args:
          - name: canary-hash
            valueFrom:
              podTemplateHashValue: Latest
      steps:
        - setWeight: 10
        - pause: {duration: 5m}
        - setWeight: 50
        - pause: {duration: 5m}
  {{- else }}
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 25%
  {{- end }}
