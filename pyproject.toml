[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "intentops"
version = "0.1.0"
description = "Intent-driven, cloud-agnostic platform agent: one service intent -> production setup on any cloud."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "pyyaml>=6.0", "mcp>=2.3,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
intentops = "intentops.cli:main"

[tool.setuptools.packages.find]
include = ["intentops*"]

[tool.setuptools.package-data]
intentops = ["profiles/*.yaml", "chart_templates/*", "chart_templates/tests/*"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
